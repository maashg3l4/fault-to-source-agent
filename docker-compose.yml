

services:
  # 1. The Graph Database (Neo4j)
  neo4j:
    image: neo4j:5.20-community
    container_name: fault-to-source-neo4j
    ports:
      - "7474:7474" # The web browser interface
      - "7687:7687" # The connection port for Python
    environment:
      - NEO4J_AUTH=neo4j/password123 # Username and Password
    volumes:
      - neo4j_data:/data

  # 2. Your Python App
  app:
    build: .
    container_name: fault-to-source-app
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123 # Must match the line above

volumes:
  neo4j_data: